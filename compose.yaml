name: flowent
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowent
      POSTGRES_USER: flowent
      POSTGRES_PASSWORD: flowent-local-db
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -h localhost -U flowent"]
      interval: 2s
      timeout: 3s
      retries: 25
  api:
    build: ./backend
    environment: &settings
      DATABASE_URL: postgresql+psycopg://flowent:flowent-local-db@db/flowent
      DEMO_PASSWORD: ${FLOWENT_DEMO_PASSWORD:-Flowent-demo-local}
      LAB_MODE: ${FLOWENT_LAB_MODE:-0}
    command: ["/bin/sh","-ec","alembic upgrade head && python -m flowent.seed && exec uvicorn flowent.api:app --host 0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health',timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build: ./backend
    environment: *settings
    command: ["python","-m","flowent.worker"]
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${FLOWENT_PORT:-8120}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
